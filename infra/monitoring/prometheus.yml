global:
  scrape_interval: 15s
  evaluation_interval: 15s

scrape_configs:
  # api - имя сервиса из docker-compose.prod.yml, 9100 - METRICS_ADDR (порт не публикуется наружу).
  - job_name: rtchesz-api
    static_configs:
      - targets: ["api:9100"]

  - job_name: prometheus
    static_configs:
      - targets: ["localhost:9090"]
